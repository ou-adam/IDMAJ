name: 🚀 Deploy Website to Hostinger

on:
  push:
    branches:
      - main
      - master

jobs:
  web-deploy:
    name: Sync website files to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Fetch Latest Code
        uses: actions/checkout@v4

      - name: 📁 Sync Files via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "set ftp:ssl-allow true; set ssl:verify-certificate false; open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER; mirror -R --verbose --continue --only-newer ./website/ ./"
